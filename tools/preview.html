<!doctype html>
<!-- The marketplace card, preview.png. Render it from the repo root with:
     chromium --headless=new --user-data-dir="$(mktemp -d)" --hide-scrollbars --window-size=1600,900 \
       --force-device-scale-factor=2 --screenshot=preview.png "file://$PWD/tools/preview.html" -->
<html>
<head>
<meta charset="utf-8">
<title>Snapback preview</title>
<style>
  :root {
    --bg: #1a1b26; --bg-dark: #13141c; --bg-darker: #0e0e14; --bg-light: #24283b;
    --fg: #a9b1d6; --fg-dim: #565f89; --fg-bright: #c0caf5; --muted: #414868; --sel: #292e42;
    --accent: #7aa2f7; --green: #9ece6a; --yellow: #e0af68; --red: #f7768e; --magenta: #ad8ee6; --cyan: #0db9d7; --orange: #ff9e64;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 700px at 50% 35%, #202232 0%, var(--bg-dark) 60%, var(--bg-darker) 100%);
    font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", "Liberation Mono", monospace;
    color: var(--fg); position: relative;
  }
  .title { position: absolute; left: 0; right: 0; top: 60px; text-align: center; }
  .title h1 { font-size: 76px; font-weight: 800; color: var(--fg-bright); letter-spacing: -1px; }
  .title h1 span { color: var(--accent); }
  .title p { margin-top: 10px; font-size: 32px; color: var(--fg); }

  /* fake monitors */
  .monitor { position: absolute; top: 290px; width: 500px; }
  .monitor.left { left: 20px; }
  .monitor.right { right: 20px; }
  .bezel { background: #08080c; border-radius: 14px; padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 0 0 2px #2a2c3c; }
  .screen { position: relative; height: 266px; border-radius: 4px; overflow: hidden; background: var(--bg); }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stand { width: 120px; height: 46px; margin: 0 auto; background: linear-gradient(#1b1c26, #101018); clip-path: polygon(30% 0, 70% 0, 82% 100%, 18% 100%); }
  .foot { width: 220px; height: 10px; margin: 0 auto; border-radius: 6px; background: #161722; }
  .label { margin-top: 18px; text-align: center; font-size: 34px; font-weight: 700; color: var(--fg-bright); }

  /* drawn screen contents */
  .bar { height: 14px; background: var(--bg-darker); display: flex; align-items: center; gap: 6px; padding: 0 8px; }
  .bar i { width: 8px; height: 6px; border-radius: 2px; background: var(--muted); }
  .bar i.on { background: var(--accent); }
  .tiles { position: absolute; inset: 14px 0 0 0; display: grid; gap: 5px; padding: 5px; }
  .coding .tiles { grid-template-columns: 1fr 1fr; }
  .tile { background: var(--bg-dark); border: 1px solid var(--accent); border-radius: 3px; padding: 8px; overflow: hidden; }
  .tile.dim { border-color: var(--muted); }
  .line { height: 6px; border-radius: 3px; margin: 6px 0; background: var(--muted); }
  .video .tiles { grid-template-rows: 1fr 0.8fr; }
  .preview { background: #000; border-radius: 3px; display: grid; place-items: center; }
  .preview b { width: 0; height: 0; border-left: 28px solid var(--fg-dim); border-top: 17px solid transparent; border-bottom: 17px solid transparent; }
  .track { height: 16px; margin: 6px 0; border-radius: 3px; display: flex; gap: 3px; }
  .track span { border-radius: 3px; }

  /* the Snapback panel, middle */
  .panel {
    position: absolute; left: 50%; top: 276px; transform: translateX(-50%); width: 400px;
    background: var(--bg); border: 2px solid var(--accent); border-radius: 12px; padding: 22px 22px 18px;
    box-shadow: 0 30px 70px rgba(0,0,0,.6);
  }
  .panel .head { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; color: var(--fg-bright); }
  .panel .head .icon { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--bg); display: grid; place-items: center; font-size: 22px; }
  .panel .sub { margin: 4px 0 16px 46px; font-size: 17px; color: var(--fg-dim); }
  .row { border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; background: var(--bg-light); border: 2px solid transparent; }
  .row.hot { border-color: var(--accent); background: var(--sel); }
  .row .name { font-size: 25px; font-weight: 700; color: var(--fg-bright); }
  .row .apps { margin-top: 4px; font-size: 17px; color: var(--fg); }
  .undo { margin-top: 6px; font-size: 17px; color: var(--fg-dim); padding: 0 4px; }

  svg.arrows { position: absolute; inset: 0; pointer-events: none; }
  .tagline { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 30px; line-height: 1.45; color: var(--fg); }
  .tagline b { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <div class="title">
    <h1>Snap<span>back</span></h1>
    <p>Save your desk as setups. Switch with one click.</p>
  </div>

  <div class="monitor left">
    <div class="bezel"><div class="screen coding" id="screen-coding">
      <div class="bar"><i class="on"></i><i></i><i></i><i></i></div>
      <div class="tiles">
        <div class="tile">
          <div class="line" style="width:40%;background:var(--accent)"></div>
          <div class="line" style="width:85%"></div><div class="line" style="width:70%"></div>
          <div class="line" style="width:55%;background:var(--green)"></div><div class="line" style="width:78%"></div>
          <div class="line" style="width:62%"></div><div class="line" style="width:35%;background:var(--yellow)"></div>
          <div class="line" style="width:80%"></div><div class="line" style="width:50%"></div>
        </div>
        <div class="tile dim">
          <div class="line" style="width:60%;background:var(--fg-dim)"></div>
          <div class="line" style="width:90%"></div><div class="line" style="width:90%"></div>
          <div class="line" style="width:30%;background:var(--green)"></div><div class="line" style="width:75%"></div>
          <div class="line" style="width:68%"></div><div class="line" style="width:82%"></div>
        </div>
      </div>
    </div></div>
    <div class="stand"></div><div class="foot"></div>
    <div class="label">Coding</div>
  </div>

  <div class="monitor right">
    <div class="bezel"><div class="screen video" id="screen-video">
      <div class="bar"><i></i><i class="on"></i><i></i><i></i></div>
      <div class="tiles">
        <div class="preview"><b></b></div>
        <div class="tile dim" style="padding:6px 8px">
          <div class="track"><span style="flex:3;background:var(--accent)"></span><span style="flex:2;background:var(--accent)"></span><span style="flex:4;background:var(--accent)"></span></div>
          <div class="track"><span style="flex:2;background:var(--magenta)"></span><span style="flex:5;background:var(--magenta)"></span></div>
          <div class="track"><span style="flex:6;background:var(--green)"></span><span style="flex:2;background:var(--green)"></span></div>
          <div class="track"><span style="flex:8;background:var(--yellow)"></span></div>
        </div>
      </div>
    </div></div>
    <div class="stand"></div><div class="foot"></div>
    <div class="label">Video editing</div>
  </div>

  <div class="panel">
    <div class="head"><div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1b26" stroke-width="3" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></div>Snapback</div>
    <div class="sub">Your setups</div>
    <div class="row hot" id="row-coding">
      <div class="name">Coding</div>
      <div class="apps">Terminal · Claude · GitHub</div>
    </div>
    <div class="row" id="row-video">
      <div class="name">Video editing</div>
      <div class="apps">Kdenlive · YouTube</div>
    </div>
    <div class="undo">Undo: Before switch</div>
  </div>

  <svg class="arrows" viewBox="0 0 1600 900">
    <defs>
      <marker id="tip" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#7aa2f7"/>
      </marker>
    </defs>
    <!-- Coding row -> left screen, Video editing row -> right screen -->
    <path d="M592,412 C 560,412 556,460 520,460" stroke="#7aa2f7" stroke-width="5" fill="none" marker-end="url(#tip)"/>
    <path d="M1008,492 C 1040,492 1044,460 1080,460" stroke="#7aa2f7" stroke-width="5" fill="none" marker-end="url(#tip)"/>
  </svg>

  <div class="tagline"><b>One screen or three:</b> missing screens fold into spare workspaces,<br>and go home when you plug back in.</div>
</body>
</html>
